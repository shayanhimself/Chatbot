name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the run be repeated from the Actions tab without another commit, which is what makes
  # a first-run failure debuggable.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # Only a job that names an environment can read the secrets kept in it.
    environment: ci
    steps:
      - uses: actions/checkout@v4

      # Compilation targets JDK 17 and Robolectric needs 21. Gradle's foojay resolver provisions
      # 17 on demand, so only the newer one is installed here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test suite and format gate
        # The tests that hit the real API read this Claude API key, and skip when there is none.
        # Saved in the secrets of the Github project
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: ./scripts/test.sh

      - name: Coverage report
        run: ./scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/build/reports/kover/html/'
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7

  instrumented:
    name: Instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # Opens /dev/kvm to every user, which is what gets the emulator hardware acceleration.
      # The runner user is not in the kvm group, and joining it would need a fresh login session.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # API 34 rather than 37: the emulator action needs a system image the runner can fetch, and
      # the app's minimum is 31, so 34 exercises a supported level.
      - name: Instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          script: ./scripts/instrumented.sh
