name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets the run be repeated from the Actions tab without another commit, which is what makes
  # a first-run failure debuggable.
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      # Compilation targets JDK 17 and Robolectric needs 21. Gradle's foojay resolver provisions
      # 17 on demand, so only the newer one is installed here.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      - name: Test suite and format gate
        run: ./scripts/test.sh

      - name: Coverage report
        run: ./scripts/coverage.sh

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: '**/build/reports/kover/html/'
          retention-days: 7

      - name: Upload reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            **/build/reports/
            **/build/test-results/
          retention-days: 7
